---
- name: Provision a new VM
  hosts: pve-01
  vars_files:
    - ../secrets.yml

  vars:
    # Override these with --extra-vars on the command line
    vm_id: 300
    vm_name: "new-vm"
    vm_cores: 2
    vm_memory: 2048 # MB
    vm_disk: 20 # GB
    vm_vlan: 60 # test/dev vlan
    vm_ip: "172.16.60.10"
    vm_gw: "172.16.60.1"
    vm_template_id: 9000 # your base template VMID

  tasks:
    - name: Clone VM from template
      community.proxmox.proxmox_kvm:
        api_host: "127.0.0.1"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        node: pve-01
        clone: "{{ vm_template_id }}"
        vmid: "{{ vm_id }}"
        name: "{{ vm_name }}"
        storage: "{{ ceph_pool }}"
        full: true
        state: present

    - name: Configure VM hardware
      community.proxmox.proxmox_kvm:
        api_host: "127.0.0.1"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        vmid: "{{ vm_id }}"
        cores: "{{ vm_cores }}"
        memory: "{{ vm_memory }}"
        net:
          net0: "virtio,bridge=vmbr0,tag={{ vm_vlan }}"
        state: present

    - name: Set VM network via cloud-init
      community.proxmox.proxmox_kvm:
        api_host: "127.0.0.1"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        vmid: "{{ vm_id }}"
        ipconfig:
          ipconfig0: "ip={{ vm_ip }}/24,gw={{ vm_gw }}"
        state: present

    - name: Start the VM
      community.proxmox.proxmox_kvm:
        api_host: "127.0.0.1"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        vmid: "{{ vm_id }}"
        state: started
