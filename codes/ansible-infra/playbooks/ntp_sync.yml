---
# ntp_sync.yml
#
# Configures chrony on all cluster nodes. pve-01 acts as the internal NTP master
# (serves time to the cluster); all other nodes sync from pve-01 with pool.ntp.org
# as fallback.
#
# Usage — full cluster:
#   ansible-playbook playbooks/ntp_sync.yml
#
# Usage — specific VMs only (skips pve-01 master play automatically):
#   ansible-playbook playbooks/ntp_sync.yml --limit "app-2,postgres"
#
# Usage — reconfigure pve-01 only:
#   ansible-playbook playbooks/ntp_sync.yml --limit "pve-01"

# ── Play 1: NTP master (pve-01) ──────────────────────────────────────────────
- name: Configure chrony NTP master (pve-01)
  hosts: pve-01
  gather_facts: true
  become: true

  handlers:
    - name: Restart chrony
      ansible.builtin.service:
        name: chrony
        state: restarted

  tasks:
    - name: Install chrony
      ansible.builtin.apt:
        name: chrony
        state: present
        update_cache: true

    - name: Deploy chrony config (master)
      ansible.builtin.copy:
        content: |
          # NTP sources (internet)
          pool pool.ntp.org iburst

          # Serve time to all cluster subnets
          allow 192.168.0.0/16
          allow 172.16.0.0/12

          # Track clients for chronyc clients output
          clientloglimit 10000000

          driftfile /var/lib/chrony/chrony.drift
          logdir /var/log/chrony
          log measurements statistics tracking clientlogs
          maxupdateskew 100.0
          rtcsync
          makestep 1 3
        dest: /etc/chrony/chrony.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart chrony

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Ensure chrony is enabled and running
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true
      when: >
        ansible_facts.services['chrony.service'] is not defined
        or ansible_facts.services['chrony.service']['state'] != 'running'
        or ansible_facts.services['chrony.service']['status'] != 'enabled'

    - name: Verify NTP synchronisation
      ansible.builtin.command: chronyc tracking
      register: chrony_status
      changed_when: false

    - name: Display sync status
      ansible.builtin.debug:
        msg: "{{ chrony_status.stdout_lines }}"

# ── Play 2: NTP clients (all except pve-01) ───────────────────────────────────
- name: Configure chrony on cluster nodes (sync from pve-01)
  hosts: all:!pve-01
  gather_facts: true
  become: true

  handlers:
    - name: Restart chrony
      ansible.builtin.service:
        name: chrony
        state: restarted

  tasks:
    - name: Install chrony
      ansible.builtin.apt:
        name: chrony
        state: present
        update_cache: true

    - name: Deploy chrony config (client)
      ansible.builtin.copy:
        content: |
          # synchroniser sur pve-01 en priorité
          server 192.168.10.100 iburst prefer
          pool pool.ntp.org iburst

          driftfile /var/lib/chrony/chrony.drift
          logdir /var/log/chrony
          maxupdateskew 100.0
          rtcsync
          makestep 1 3
        dest: /etc/chrony/chrony.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart chrony

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Ensure chrony is enabled and running
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true
      when: >
        ansible_facts.services['chrony.service'] is not defined
        or ansible_facts.services['chrony.service']['state'] != 'running'
        or ansible_facts.services['chrony.service']['status'] != 'enabled'

    - name: Verify NTP synchronisation
      ansible.builtin.command: chronyc tracking
      register: chrony_status
      changed_when: false

    - name: Display sync status
      ansible.builtin.debug:
        msg: "{{ chrony_status.stdout_lines }}"
