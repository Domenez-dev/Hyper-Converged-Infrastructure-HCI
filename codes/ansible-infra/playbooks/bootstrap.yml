---
# bootstrap.yml
#
# Usage:
#   ansible-playbook playbooks/bootstrap.yml \
#     -e "target=192.168.10.120" \
#     -e "bootstrap_password=ROOT_PASS"
#
#   ansible-playbook playbooks/bootstrap.yml \
#     -e "target=all" \
#     -e "bootstrap_password=ROOT_PASS"
#
#   target accepts raw IPs, inventory hostnames, comma-separated lists, or "all".
#   Hosts do NOT need to exist in inventory when using raw IPs.
#
# After running, add the VM to managed_vms in inventory/hosts.yml.

- name: Register target(s) in memory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add each target to bootstrap group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: bootstrap_target
      loop: "{{ target.split(',') }}"
      when: target != 'all'

- name: Bootstrap VM - prepare for Ansible management
  hosts: "{{ 'all' if target == 'all' else 'bootstrap_target' }}"
  gather_facts: false

  vars:
    ansible_user: root
    ansible_password: "{{ bootstrap_password }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o PreferredAuthentications=password"
    _key_file: "{{ ssh_public_key_file | default('~/.ssh/ansible_ed25519.pub') }}"
    ssh_public_key: "{{ lookup('file', _key_file) }}"

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Install python3 and sudo
      ansible.builtin.raw: apt-get update -qq --fix-missing; apt-get install -y --fix-missing python3 sudo
      changed_when: true

    - name: Create ansible user
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash
        create_home: true
        state: present

    - name: Configure passwordless sudo for ansible user
      ansible.builtin.copy:
        content: "ansible ALL=(ALL) NOPASSWD:ALL\n"
        dest: /etc/sudoers.d/ansible
        mode: "0440"
        validate: visudo -cf %s

    - name: Create .ssh directory for ansible user
      ansible.builtin.file:
        path: /home/ansible/.ssh
        state: directory
        owner: ansible
        group: ansible
        mode: "0700"

    - name: Deploy SSH public key for ansible user
      ansible.builtin.copy:
        content: "{{ ssh_public_key }}\n"
        dest: /home/ansible/.ssh/authorized_keys
        owner: ansible
        group: ansible
        mode: "0600"

# ------------------------------------------------------------------
# Play 3: connect as the ansible user and bring packages up to date
- name: Update and upgrade packages on bootstrapped host(s)
  hosts: "{{ 'all' if target == 'all' else 'bootstrap_target' }}"
  gather_facts: true
  become: true

  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: "{{ ssh_private_key_file | default('~/.ssh/ansible_ed25519') }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  tasks:
    - name: Wait for SSH as the ansible user
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0 # force refresh

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: upgrade_result

    - name: Show upgrade summary
      ansible.builtin.debug:
        msg: "{{ upgrade_result.stdout_lines | default(['Nothing to upgrade']) }}"

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Notify if reboot is needed
      ansible.builtin.debug:
        msg: "NOTICE: {{ inventory_hostname }} requires a reboot (kernel or libc updated)."
      when: reboot_flag.stat.exists
