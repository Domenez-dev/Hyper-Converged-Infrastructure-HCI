---
# bootstrap.yml
#
# Usage:
#   ansible-playbook playbooks/bootstrap.yml -e "bootstrap_password=yourRootPassword"
#
# What it does:
#   Play 1 — connects as root (password), creates the ansible user, deploys the
#             SSH public key, configures passwordless sudo, installs python3.
#   Play 2 — connects as ansible (key), installs and enables chrony.
#
# After running this once per VM, the VM is fully managed by Ansible.
# Add it to managed_vms in inventory/hosts.yml.

# ------------------------------------------------------------------
# Play 1: Bootstrap as root
- name: Bootstrap VM - prepare for Ansible management
  hosts: managed_vms
  gather_facts: false

  vars:
    ansible_user: root
    ansible_password: "{{ bootstrap_password }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    ssh_public_key: "{{ lookup('file', '/var/lib/rundeck/.ssh/ansible_ed25519.pub') }}"

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Install python3 (required by Ansible modules)
      ansible.builtin.raw: apt-get update -qq && apt-get install -y python3
      changed_when: true

    - name: Create ansible user
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash
        create_home: true
        state: present

    - name: Configure passwordless sudo for ansible user
      ansible.builtin.copy:
        content: "ansible ALL=(ALL) NOPASSWD:ALL\n"
        dest: /etc/sudoers.d/ansible
        mode: "0440"
        validate: visudo -cf %s

    - name: Create .ssh directory for ansible user
      ansible.builtin.file:
        path: /home/ansible/.ssh
        state: directory
        owner: ansible
        group: ansible
        mode: "0700"

    - name: Deploy SSH public key for ansible user
      ansible.builtin.copy:
        content: "{{ ssh_public_key }}\n"
        dest: /home/ansible/.ssh/authorized_keys
        owner: ansible
        group: ansible
        mode: "0600"

# ------------------------------------------------------------------
# Play 2: Install chrony as ansible user (key-based from here on)
- name: Install chrony on managed VMs
  hosts: managed_vms
  gather_facts: true
  become: true

  tasks:
    - name: Install chrony
      ansible.builtin.apt:
        name: chrony
        state: present
        update_cache: true

    - name: Enable and start chrony
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    - name: Show chrony tracking status
      ansible.builtin.command: chronyc tracking
      register: chrony_status
      changed_when: false

    - name: Display chrony status
      ansible.builtin.debug:
        msg: "{{ chrony_status.stdout_lines }}"
