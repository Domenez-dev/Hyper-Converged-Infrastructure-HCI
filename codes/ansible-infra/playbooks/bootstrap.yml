---
# bootstrap.yml
#
# Usage (local dev):
#   ansible-playbook playbooks/bootstrap.yml \
#     -e "bootstrap_password=yourRootPassword" \
#     -e "ssh_public_key_file=~/.ssh/ansible_ed25519.pub" \
#     --limit "gitlab,clbs"
#
# Usage (from Rundeck VM):
#   ansible-playbook playbooks/bootstrap.yml \
#     -e "bootstrap_password=yourRootPassword"
#
# What it does:
#   Play 1 — connects as root (password), installs python3 + sudo,
#             creates the ansible user, deploys SSH key, configures sudoers.
#   Play 2 — connects as ansible (key), installs and enables chrony.
#
# Always use --limit to target only the VMs you want to bootstrap.

# ------------------------------------------------------------------
# Play 1: Bootstrap as root
- name: Bootstrap VM - prepare for Ansible management
  hosts: managed_vms
  gather_facts: false
  ignore_unreachable: true

  vars:
    ansible_user: root
    ansible_password: "{{ bootstrap_password }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    ssh_public_key_file: "~/.ssh/ansible_ed25519.pub"
    ssh_public_key: "{{ lookup('file', ssh_public_key_file) }}"

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Install python3 (skip apt-get update failure if repos are broken)
      ansible.builtin.raw: |
        if ! command -v python3 >/dev/null 2>&1; then
          apt-get update -qq 2>/dev/null || true
          apt-get install -y python3
        fi
      changed_when: true

    - name: Install sudo
      ansible.builtin.raw: apt-get install -y sudo
      changed_when: true

    - name: Create ansible user
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash
        create_home: true
        state: present

    - name: Configure passwordless sudo for ansible user
      ansible.builtin.copy:
        content: "ansible ALL=(ALL) NOPASSWD:ALL\n"
        dest: /etc/sudoers.d/ansible
        mode: "0440"
        validate: visudo -cf %s

    - name: Create .ssh directory for ansible user
      ansible.builtin.file:
        path: /home/ansible/.ssh
        state: directory
        owner: ansible
        group: ansible
        mode: "0700"

    - name: Deploy SSH public key for ansible user
      ansible.builtin.copy:
        content: "{{ ssh_public_key }}\n"
        dest: /home/ansible/.ssh/authorized_keys
        owner: ansible
        group: ansible
        mode: "0600"

# ------------------------------------------------------------------
# Play 2: Install chrony as ansible user (key-based from here on)
- name: Install chrony on managed VMs
  hosts: managed_vms
  gather_facts: true
  become: true
  ignore_unreachable: true

  tasks:
    - name: Install chrony
      ansible.builtin.apt:
        name: chrony
        state: present
        update_cache: true

    - name: Enable and start chrony
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    - name: Show chrony tracking status
      ansible.builtin.command: chronyc tracking
      register: chrony_status
      changed_when: false

    - name: Display chrony status
      ansible.builtin.debug:
        msg: "{{ chrony_status.stdout_lines }}"
