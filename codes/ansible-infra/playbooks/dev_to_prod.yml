---
- name: Migrate VM from test VLAN to production VLAN
  hosts: pve-01
  vars_files:
    - ../secrets.yml

  vars:
    vm_id: 101
    new_ip: "172.16.60.20"
    new_gw: "172.16.60.1"

  tasks:
    - name: Shut down VM cleanly before network change
      community.proxmox.proxmox_kvm:
        api_host: "127.0.0.1"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        vmid: "{{ vm_id }}"
        state: stopped
        force: false # graceful shutdown, not kill

    - name: Move VM network to production VLAN 60
      community.proxmox.proxmox_kvm:
        api_host: "127.0.0.1"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        vmid: "{{ vm_id }}"
        net:
          net0: "virtio,bridge=vmbr0,tag=60"
        ipconfig:
          ipconfig0: "ip={{ new_ip }}/24,gw={{ new_gw }}"
        state: present

    - name: Start VM on production network
      community.proxmox.proxmox_kvm:
        api_host: "127.0.0.1"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        vmid: "{{ vm_id }}"
        state: started

    - name: Live migrate VM to best node (optional)
      community.proxmox.proxmox_kvm:
        api_host: "127.0.0.1"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        vmid: "{{ vm_id }}"
        migrate: true
        target: pve-02 # or whichever node has most free resources
        state: present
