---
# provision_vm.yml
#
# Usage examples:
#
#   Linked clone (default):
#     ansible-playbook playbooks/provision_vm.yml -e "vm_id=110 vm_name=my-server"
#
#   Full clone (explicit):
#     ansible-playbook playbooks/provision_vm.yml -e "vm_id=110 vm_name=my-server vm_full_clone=true"
#
#   Custom CPU/RAM:
#     ansible-playbook playbooks/provision_vm.yml \
#       -e "vm_id=115 vm_name=heavy-server vm_cores=4 vm_memory=8192"
#
#   Multiple VMs in one run (loop via shell):
#     for id in 110 111 112; do
#       ansible-playbook playbooks/provision_vm.yml -e "vm_id=$id vm_name=node-$id"
#     done
#
# IP formula: 172.16.60.(vm_id - 90)
#   vm 110 -> .20
#   vm 115 -> .25
#   vm 200 -> .110
#
# The playbook:
#   1. Clones debian-Template on the chosen proxmox node
#   2. Applies hardware config (cpu/ram from template unless overridden)
#   3. Sets cloud-init static IP derived from vm_id
#   4. Starts the VM
#
# This playbook does NOT connect to the new VM over SSH (the template's
# user/key isn't set up for Ansible management yet) and does NOT run
# apt update/upgrade. Once the VM is up, bootstrap it with:
#
#   ansible-playbook playbooks/bootstrap.yml \
#     -e "target=<vm_ip> bootstrap_password=<root_password>"
#
# bootstrap.yml also runs apt update/upgrade once SSH access is ready.

- name: Provision VM from debian-Template
  # Always runs on the node that owns the template config.
  # For linked clones: VM lands here. For full clones: VM lands on target_node via --target.
  hosts: "{{ vm_template_node | default('pve-03') }}"
  gather_facts: false
  vars_files:
    - ../secrets.yml

  vars:
    # ---- passes via -e ----
    vm_id: ~
    vm_name: ~
    vm_full_clone: false

    # ---- Template source ----
    vm_template_name: "debian-Template"
    vm_template_id: 111
    vm_template_node: "pve-03" # node that owns the template config

    # ---- Hardware defaults (mirrors the template) ----
    # Override with -e
    vm_cores: 2
    vm_memory: 4096 # MB
    vm_disk: 20 # GB (resize only when vm_disk_resize: true)
    vm_disk_resize: false

    # ---- Network ----
    vm_gw: "172.16.60.1"
    vm_dns: "8.8.8.8"
    vm_ip: "172.16.60.{{ vm_id | int - 90 }}" # 172.16.60.(vm_id - 90)
    vm_cidr: "{{ vm_ip }}/24"

    # ---- Proxmox API (local to the node) ----
    pve_api_host: "127.0.0.1"
    pve_node: "{{ target_node | default('pve-01') }}"

    # Node that actually holds the VM's config after cloning:
    #   - full clone   -> lands on pve_node (the --target node)
    #   - linked clone -> stays on vm_template_node (no --target used)
    vm_actual_node: "{{ pve_node if (vm_full_clone | bool) else vm_template_node }}"

  pre_tasks:
    - name: Ensure proxmoxer is installed on the node
      ansible.builtin.apt:
        name: python3-proxmoxer
        state: present
        update_cache: true
      become: true
      tags: [always]

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - vm_id is not none
          - vm_name is not none
          - vm_id | int > 90
        fail_msg: >
          You must pass vm_id (integer > 90) and vm_name via -e.
          Example: -e "vm_id=110 vm_name=my-server"
      tags: [always]

    - name: Show VM plan
      ansible.builtin.debug:
        msg:
          - "VM ID    : {{ vm_id }}"
          - "VM Name  : {{ vm_name }}"
          - "Node     : {{ pve_node }}"
          - "Template : {{ vm_template_name }} ({{ vm_template_id }})"
          - "IP       : {{ vm_ip }}/24  ({{ vm_id }} - 90 = {{ vm_id | int - 90 }})"
          - "Gateway  : {{ vm_gw }}"
          - "CPU      : {{ vm_cores }} cores"
          - "RAM      : {{ vm_memory }} MB"
      tags: [always]

  tasks:
    # 1. Clone

    # Debug clone mode
    - name: Debug clone mode
      ansible.builtin.debug:
        msg: "Clone mode: {{ 'FULL' if vm_full_clone | bool else 'LINKED' }}"
      tags: [clone]

    - name: Full-clone template to new VM
      ansible.builtin.shell:
        cmd: "qm clone {{ vm_template_id }} {{ vm_id }} --name {{ vm_name }} --full 1 --storage {{ ceph_pool }} --target {{ pve_node }}"
      become: true
      register: clone_result
      changed_when: clone_result.rc == 0
      when: vm_full_clone | bool
      tags: [clone]

    # Linked clone requires the template to be on the same node as target_node.
    # Use full clone (vm_full_clone=true) for cross-node provisioning.
    - name: Linked-clone template to new VM
      ansible.builtin.shell:
        cmd: "qm clone {{ vm_template_id }} {{ vm_id }} --name {{ vm_name }}"
      become: true
      register: clone_result
      changed_when: clone_result.rc == 0
      when: not (vm_full_clone | bool)
      tags: [clone]

    - name: Wait a moment for the clone to settle
      ansible.builtin.pause:
        seconds: 5
      tags: [clone]

    # 2. Hardware config
    - name: Configure VM hardware (CPU + RAM)
      ansible.builtin.shell:
        cmd: >
          qm set {{ vm_id }}
          --cores {{ vm_cores }}
          --memory {{ vm_memory }}
      delegate_to: "{{ vm_actual_node }}"
      become: true
      tags: [hardware]

    # 3. Cloud-init static IP
    - name: Attach cloud-init drive
      ansible.builtin.shell:
        cmd: "qm set {{ vm_id }} --ide2 {{ ceph_pool }}:cloudinit"
      delegate_to: "{{ vm_actual_node }}"
      become: true
      register: cloudinit_attach
      failed_when:
        - cloudinit_attach.rc != 0
        - "'File exists' not in cloudinit_attach.stderr"
        - "'already exists' not in cloudinit_attach.stderr"
      changed_when: cloudinit_attach.rc == 0
      tags: [network]

    - name: Set cloud-init network
      ansible.builtin.shell:
        cmd: >
          qm set {{ vm_id }}
          --ipconfig0 ip={{ vm_cidr }},gw={{ vm_gw }}
          --nameserver {{ vm_dns }}
      delegate_to: "{{ vm_actual_node }}"
      become: true
      tags: [network]

    - name: Set cloud-init DNS
      ansible.builtin.shell:
        cmd: "qm set {{ vm_id }} --nameserver 8.8.8.8 --searchdomain localdomain"
      delegate_to: "{{ vm_actual_node }}"
      become: true
      tags: [network]

    - name: Regenerate cloud-init drive
      ansible.builtin.shell:
        cmd: "qm cloudinit update {{ vm_id }}"
      delegate_to: "{{ vm_actual_node }}"
      become: true
      tags: [network]

    # Optional: grow the disk if vm_disk_resize is set to true
    - name: Resize disk (optional)
      community.proxmox.proxmox_disk:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        vmid: "{{ vm_id }}"
        disk: scsi0
        size: "{{ vm_disk }}G"
        state: resized
      when: vm_disk_resize | bool
      tags: [disk]

    # 4. Start VM
    - name: Start the VM
      ansible.builtin.shell:
        cmd: "qm start {{ vm_id }}"
      delegate_to: "{{ vm_actual_node }}"
      become: true
      register: start_result
      failed_when: >
        start_result.rc != 0 and
        'already running' not in start_result.stderr
      changed_when: start_result.rc == 0
      tags: [start]

    - name: Show next steps
      ansible.builtin.debug:
        msg:
          - "VM {{ vm_name }} ({{ vm_id }}) is provisioned and starting at {{ vm_ip }}."
          - "It is not yet bootstrapped for Ansible management."
          - >-
            Run: ansible-playbook playbooks/bootstrap.yml
            -e "target={{ vm_ip }} bootstrap_password=<root_password>"
      tags: [always]
