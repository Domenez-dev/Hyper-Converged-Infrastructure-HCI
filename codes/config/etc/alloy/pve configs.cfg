// ============================================================
// ALLOY CONFIG - Proxmox Node Log Shipping
// Target: Loki on monitoring VM
// Covers: auth/SSH, Proxmox web UI, GitLab, Corosync, kernel
// ============================================================

// --- Local metadata ---
local.file "hostname" {
  filename = "/etc/hostname"
}

// ============================================================
// SECURITY LOGS
// ============================================================

// SSH / sudo / PAM auth
loki.source.file "auth_log" {
  targets = [
    {
      __path__ = "/var/log/auth.log",
      job      = "auth",
      host     = sys.env("HOSTNAME"),
      category = "security",
    },
  ]
  forward_to = [loki.process.auth_pipeline.receiver]
}

loki.process "auth_pipeline" {
  // Tag SSH failures
  stage.match {
    selector = "{job=\"auth\"}"
    stage.regex {
      expression = "(?P<event>Failed password|Accepted password|Accepted publickey|sudo:|session opened|session closed|authentication failure)"
    }
    stage.labels {
      values = {
        event = "event",
      }
    }
  }

  // Drop noisy keepalive lines
  stage.drop {
    expression  = ".*CRON.*session (opened|closed) for user root.*"
    drop_counter_reason = "cron_noise"
  }

  forward_to = [loki.write.loki_endpoint.receiver]
}

// Proxmox web UI access logs (port 8006 - pveproxy)
loki.source.file "pveproxy_log" {
  targets = [
    {
      __path__ = "/var/log/pveproxy/access.log",
      job      = "pveproxy",
      host     = sys.env("HOSTNAME"),
      category = "security",
    },
  ]
  forward_to = [loki.process.pveproxy_pipeline.receiver]
}

loki.process "pveproxy_pipeline" {
  stage.regex {
    expression = "(?P<method>GET|POST|PUT|DELETE|PATCH) (?P<path>\\S+) HTTP/\\S+ (?P<status>\\d{3})"
  }
  stage.labels {
    values = {
      method = "method",
      status = "status",
    }
  }

  // Flag non-200 responses as interesting
  stage.match {
    selector = "{job=\"pveproxy\"}"
    stage.regex {
      expression = "(?P<status_class>[45]\\d\\d)"
    }
    stage.labels {
      values = {
        alert = "http_error",
      }
    }
  }

  forward_to = [loki.write.loki_endpoint.receiver]
}

// ============================================================
// CLUSTER STABILITY - COROSYNC
// ============================================================

loki.source.file "corosync_log" {
  targets = [
    {
      __path__ = "/var/log/corosync/corosync.log",
      job      = "corosync",
      host     = sys.env("HOSTNAME"),
      category = "cluster",
    },
  ]
  forward_to = [loki.process.corosync_pipeline.receiver]
}

loki.process "corosync_pipeline" {
  stage.match {
    selector = "{job=\"corosync\"}"
    stage.regex {
      expression = "(?P<event>TOTEM|quorum|member (joined|left|added|removed)|node.*became|ring|ERROR|CRIT|error|warning)"
    }
    stage.labels {
      values = {
        event = "event",
      }
    }
  }

  // Severity label from corosync log level prefix
  stage.regex {
    expression = "\\[(?P<level>error|warning|notice|info|debug)\\]"
  }
  stage.labels {
    values = {
      level = "level",
    }
  }

  forward_to = [loki.write.loki_endpoint.receiver]
}

// ============================================================
// KERNEL LOGS (OOM, disk errors, hardware)
// ============================================================

loki.source.file "kern_log" {
  targets = [
    {
      __path__ = "/var/log/kern.log",
      job      = "kernel",
      host     = sys.env("HOSTNAME"),
      category = "stability",
    },
  ]
  forward_to = [loki.process.kern_pipeline.receiver]
}

loki.process "kern_pipeline" {
  stage.match {
    selector = "{job=\"kernel\"}"
    stage.regex {
      expression = "(?P<event>Out of memory|oom_kill|I/O error|EXT4-fs error|SCSI error|blk_update_request|mce:|Hardware Error|kernel BUG|Oops)"
    }
    stage.labels {
      values = {
        event = "event",
      }
    }
  }

  // Drop routine noisy lines
  stage.drop {
    expression          = ".*audit.*apparmor.*"
    drop_counter_reason = "apparmor_audit_noise"
  }

  forward_to = [loki.write.loki_endpoint.receiver]
}

// ============================================================
// SYSLOG (catch-all for remaining pve daemon messages)
// ============================================================

loki.source.file "syslog" {
  targets = [
    {
      __path__ = "/var/log/syslog",
      job      = "syslog",
      host     = sys.env("HOSTNAME"),
      category = "general",
    },
  ]
  forward_to = [loki.process.syslog_pipeline.receiver]
}

loki.process "syslog_pipeline" {
  // Only keep lines with meaningful severity
  stage.match {
    selector = "{job=\"syslog\"}"
    stage.regex {
      expression = "(?P<level>error|warning|critical|alert|emergency|err|crit|warn)"
    }
    stage.labels {
      values = {
        level = "level",
      }
    }
  }

  forward_to = [loki.write.loki_endpoint.receiver]
}

// ============================================================
// LOKI OUTPUT
// ============================================================

loki.write "loki_endpoint" {
  endpoint {
    url = "http://192.168.10.99:3100/loki/api/v1/push"
  }
  external_labels = {
    cluster = "proxmox-home",
  }
}
