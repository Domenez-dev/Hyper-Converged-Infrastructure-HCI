---
- name: Install and configure Telegraf for Ceph metrics on PVE nodes
  hosts: proxmox_nodes
  vars:
    influxdb_url: "http://192.168.10.99:8086"
    influxdb_org: "proxmox-lab"
    influxdb_bucket: "ceph-metrics"
    influxdb_token: "Zp10ytkQT_zAKbqOqpiRTni_QzZpRh70jw2IQahureM9hNOj8geVlY4lCLj-ZfH_V6aTIRcA0YeJG8gRvUQa9A=="

  tasks:
    # ------------------------------------------------
    # Step 1: Install Telegraf
    # ------------------------------------------------

    - name: Install gnupg and curl prerequisites
      apt:
        name:
          - gnupg
          - curl
        state: present
        update_cache: true

    - name: Download InfluxDB GPG key
      get_url:
        url: https://repos.influxdata.com/influxdata-archive_compat.key
        dest: /tmp/influxdata.key
        mode: "0644"

    - name: Dearmor and install GPG key
      shell: |
        gpg --dearmor < /tmp/influxdata.key \
          > /etc/apt/trusted.gpg.d/influxdata.gpg
      args:
        creates: /etc/apt/trusted.gpg.d/influxdata.gpg

    - name: Add InfluxDB apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/trusted.gpg.d/influxdata.gpg] https://repos.influxdata.com/debian stable main"
        state: present
        filename: influxdb

    - name: Install Telegraf
      apt:
        name: telegraf
        state: present
        update_cache: true

    # ------------------------------------------------
    # Step 2: Fix Ceph socket permissions
    # ------------------------------------------------

    - name: Add telegraf user to ceph group
      user:
        name: telegraf
        groups: ceph
        append: true

    - name: Ensure ceph socket directory is group readable
      file:
        path: /var/run/ceph
        mode: "0750"
        state: directory

    - name: Create tmpfiles rule so permissions survive reboot
      copy:
        dest: /etc/tmpfiles.d/ceph-telegraf.conf
        content: |
          d /var/run/ceph 0750 ceph ceph -

    # ------------------------------------------------
    # Step 4: Write Telegraf config
    # ------------------------------------------------

    - name: Write Telegraf configuration
      copy:
        dest: /etc/telegraf/telegraf.conf
        content: |
          [agent]
            interval = "30s"
            flush_interval = "30s"
            hostname = "{{ inventory_hostname }}"

          [[outputs.influxdb_v2]]
            urls = ["{{ influxdb_url }}"]
            token = "{{ influxdb_token }}"
            organization = "{{ influxdb_org }}"
            bucket = "{{ influxdb_bucket }}"

          [[inputs.ceph]]
            interval = "1m"
            ceph_binary = "/usr/bin/ceph"
            socket_dir = "/var/run/ceph"
            socket_prefix = "ceph-"
            socket_suffix = "asok"
            gather_admin_socket_stats = true
            gather_cluster_stats = true
      notify: restart telegraf

    # ------------------------------------------------
    # Step 5: Start Telegraf
    # ------------------------------------------------

    - name: Enable and start Telegraf service
      service:
        name: telegraf
        state: started
        enabled: true

  handlers:
    - name: restart telegraf
      service:
        name: telegraf
        state: restarted
